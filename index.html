<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elda Style | Tienda de ropa</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7f7;
    color:#222;
}

/* HEADER */
header{
    background:#111;
    color:white;
    padding:18px 25px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header-container{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    letter-spacing:1px;
}

.logo span{
    color:#ff4f81;
}

.search-box{
    flex:1;
    max-width:420px;
}

.search-box input{
    width:100%;
    padding:12px 16px;
    border:none;
    border-radius:25px;
    outline:none;
    font-size:15px;
}

/* HERO */
.hero{
    background:linear-gradient(135deg,#ff4f81,#ff8fab);
    color:white;
    text-align:center;
    padding:55px 20px;
}

.hero h1{
    font-size:42px;
    margin-bottom:12px;
}

.hero p{
    font-size:18px;
}

/* CATEGORIAS */
.categories{
    max-width:1200px;
    margin:25px auto;
    padding:0 20px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.category-btn{
    border:none;
    background:white;
    padding:11px 20px;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    transition:.2s;
}

.category-btn:hover,
.category-btn.active{
    background:#ff4f81;
    color:white;
}

/* PRODUCTOS */
.products-container{
    max-width:1200px;
    margin:auto;
    padding:10px 20px 50px;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
}

/* TARJETA */
.product-card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-3px);
    box-shadow:0 7px 18px rgba(0,0,0,.12);
}

.product-image{
    width:100%;
    height:300px;
    background:#eee;
    object-fit:cover;
    display:block;
}

.product-info{
    padding:15px;
}

.product-code{
    color:#777;
    font-size:13px;
    margin-bottom:5px;
}

.product-name{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.price{
    font-size:17px;
    font-weight:bold;
    margin-bottom:14px;
}

.product-buttons{
    display:flex;
    gap:8px;
}

.btn{
    border:none;
    padding:11px 10px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    flex:1;
}

.btn-gallery{
    background:#eee;
    color:#222;
}

.btn-whatsapp{
    background:#20c76a;
    color:white;
}

.btn-cart{
    width:100%;
    margin-top:8px;
    background:#111;
    color:white;
}

/* GALERIA */
.modal{
    display:none;
    position:fixed;
    z-index:2000;
    inset:0;
    background:rgba(0,0,0,.88);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    width:100%;
    max-width:700px;
    text-align:center;
    position:relative;
}

.modal-image{
    max-width:100%;
    max-height:75vh;
    border-radius:10px;
    object-fit:contain;
}

.close-modal{
    position:absolute;
    right:-5px;
    top:-45px;
    color:white;
    font-size:38px;
    cursor:pointer;
}

.gallery-controls{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:15px;
}

.gallery-controls button{
    background:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

/* CARRITO */
.cart-button{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:1500;
    width:60px;
    height:60px;
    border:none;
    border-radius:50%;
    background:#111;
    color:white;
    font-size:25px;
    cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
}

.cart-count{
    position:absolute;
    top:-5px;
    right:-5px;
    background:#ff4f81;
    color:white;
    width:23px;
    height:23px;
    border-radius:50%;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.cart-panel{
    position:fixed;
    right:-400px;
    top:0;
    width:380px;
    max-width:90%;
    height:100vh;
    background:white;
    z-index:1800;
    box-shadow:-5px 0 20px rgba(0,0,0,.2);
    transition:.3s;
    display:flex;
    flex-direction:column;
}

.cart-panel.open{
    right:0;
}

.cart-header{
    padding:20px;
    background:#111;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close-cart{
    border:none;
    background:none;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.cart-items{
    flex:1;
    overflow:auto;
    padding:15px;
}

.cart-item{
    border-bottom:1px solid #ddd;
    padding:12px 0;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.cart-item-info{
    flex:1;
}

.cart-item-code{
    font-size:12px;
    color:#777;
}

.remove-item{
    background:#e53935;
    color:white;
    border:none;
    border-radius:5px;
    padding:5px 8px;
    cursor:pointer;
}

.cart-footer{
    padding:20px;
    border-top:1px solid #ddd;
}

.whatsapp-cart{
    width:100%;
    border:none;
    background:#20c76a;
    color:white;
    padding:14px;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.empty-cart{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

/* FOOTER */
footer{
    background:#111;
    color:white;
    text-align:center;
    padding:30px 20px;
    margin-top:20px;
}

footer h2{
    margin-bottom:10px;
}

footer p{
    color:#ccc;
    margin:5px;
}

/* SIN RESULTADOS */
.no-products{
    text-align:center;
    padding:50px;
    color:#777;
}

/* RESPONSIVE */
@media(max-width:700px){

    .header-container{
        flex-direction:column;
    }

    .search-box{
        max-width:none;
        width:100%;
    }

    .hero h1{
        font-size:32px;
    }

    .products-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .product-image{
        height:230px;
    }

    .product-info{
        padding:10px;
    }

    .product-name{
        font-size:16px;
    }

    .product-buttons{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}

@media(max-width:420px){

    .products-grid{
        grid-template-columns:1fr 1fr;
    }

    .product-image{
        height:200px;
    }

    .hero{
        padding:40px 15px;
    }
}
</style>
</head>

</section>


<!-- MODAL GALERIA -->
<div

</div>


<!-- CARRITO -->
<button

>

    <span

<div

    <div

    <div class="cart-footer">

<footer>

===================================================== */

let currentCategory = "todos";

let cart = [];

let currentGalleryProduct = null;

let currentGalleryIndex = 0;


/* =====================================================
   MOSTRAR PRODUCTOS
===================================================== */

function renderProducts(){

    const grid =
        document.getElementById("productsGrid");

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    let filtered = products.filter(product => {

        const categoryMatch =
            currentCategory === "todos" ||
            product.categoria === currentCategory;

        const searchMatch =
            product.codigo.toLowerCase().includes(search) ||
            product.nombre.toLowerCase().includes(search);

        return categoryMatch && searchMatch;

    });


    if(filtered.length === 0){

        grid.innerHTML = `
            <div class="no-products">
                <h2>No encontramos productos</h2>
                <p>Prueba con otro código o nombre.</p>
            </div>
        `;

        return;
    }


    grid.innerHTML = filtered.map(product => {

        const firstImage =
            product.imagenes[0];

        return `

            <article class="product-card">

                <img
                    class="product-image"
                    src="${firstImage}"
                    alt="${product.nombre}"
                    onerror="imageError(this)"
                >

                <div class="product-info">

                    <div class="product-code">
                        Código: ${product.codigo}
                    </div>

                    <div class="product-name">
                        ${product.nombre}
                    </div>

                    <div class="price">
                        Consultar precio
                    </div>

                    <div class="product-buttons">

                        <button
                            class="btn btn-gallery"
                            onclick="openGallery('${product.codigo}')"
                        >
                            📷 Ver fotos
                        </button>

                        <button
                            class="btn btn-whatsapp"
                            onclick="buyWhatsApp('${product.codigo}')"
                        >
                            WhatsApp
                        </button>

                    </div>

                    <button
                        class="btn btn-cart"
                        onclick="addToCart('${product.codigo}')"
                    >
                        🛒 Agregar al carrito
                    </button>

                </div>

            </article>

        `;

    }).join("");

}


/* =====================================================
   ERROR DE IMAGEN
===================================================== */

function imageError(img){

    img.onerror = null;

    img.src =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="600"
                 height="700">

                <rect width="100%"
                      height="100%"
                      fill="#eeeeee"/>

                <text
                    x="50%"
                    y="50%"
                    text-anchor="middle"
                    font-family="Arial"
                    font-size="24"
                    fill="#777">
                    Imagen no disponible
                </text>

            </svg>
        `);

}


/* =====================================================
   FILTRO DE CATEGORIA
===================================================== */

function filterCategory(category,button){

    currentCategory = category;

    document
        .querySelectorAll(".category-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    renderProducts();
}


/* =====================================================
   WHATSAPP PRODUCTO
===================================================== */

function buyWhatsApp(code){

    const product =
        products.find(p =>
            p.codigo === code
        );

    if(!product) return;


    const imageUrl =
        GITHUB_IMAGE_BASE +
        product.imagenes[0];


    const message =
`Hola, Elda Style 👋

Estoy interesado/a en esta prenda:

🆔 Código: ${product.codigo}

🛍️ Producto: ${product.nombre}

🖼️ Foto del producto:
${imageUrl}

¿Está disponible y cuál es su precio?`;


    const url =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);


    window.open(url,"_blank");

}


/* =====================================================
   GALERIA
===================================================== */

function openGallery(code){

    const product =
        products.find(p =>
            p.codigo === code
        );

    if(!product) return;


    currentGalleryProduct = product;

    currentGalleryIndex = 0;

    updateGallery();

    document
        .getElementById("galleryModal")
        .style.display = "flex";

}


function updateGallery(){

    if(!currentGalleryProduct) return;


    const image =
        currentGalleryProduct
        .imagenes[currentGalleryIndex];


    document
        .getElementById("galleryImage")
        .src = image;

}


function nextImage(){

    if(!currentGalleryProduct) return;


    currentGalleryIndex++;

    if(
        currentGalleryIndex >=
        currentGalleryProduct.imagenes.length
    ){

        currentGalleryIndex = 0;

    }

    updateGallery();

}


function previousImage(){

    if(!currentGalleryProduct) return;


    currentGalleryIndex--;

    if(currentGalleryIndex < 0){

        currentGalleryIndex =
            currentGalleryProduct.imagenes.length - 1;

    }

    updateGallery();

}


function closeGallery(){

    document
        .getElementById("galleryModal")
        .style.display = "none";

}


function closeGalleryOutside(event){

    if(
        event.target.id === "galleryModal"
    ){

        closeGallery();

    }

}


/* =====================================================
   CARRITO
===================================================== */

function addToCart(code){

    const product =
        products.find(p =>
            p.codigo === code
        );

    if(!product) return;


    cart.push(product);

    updateCart();

    alert(
        product.nombre +
        " fue agregado al carrito 🛒"
    );

}


function removeFromCart(index){

    cart.splice(index,1);

    updateCart();

}


function updateCart(){

    const count =
        document.getElementById("cartCount");

    count.textContent =
        cart.length;


    const container =
        document.getElementById("cartItems");


    if(cart.length === 0){

        container.innerHTML = `
            <div class="empty-cart">
                🛒<br><br>
                Tu carrito está vacío.
            </div>
        `;

        return;
    }


    container.innerHTML =
        cart.map((product,index) => `

            <div class="cart-item">

                <div class="cart-item-info">

                    <strong>
                        ${product.nombre}
                    </strong>

                    <div class="cart-item-code">
                        Código: ${product.codigo}
                    </div>

                </div>

                <button
                    class="remove-item"
                    onclick="removeFromCart(${index})"
                >
                    ×
                </button>

            </div>

        `).join("");

}


function toggleCart(){

    document
        .getElementById("cartPanel")
        .classList.toggle("open");

}


/* =====================================================
   ENVIAR CARRITO A WHATSAPP
===================================================== */

function sendCartWhatsApp(){

    if(cart.length === 0){

        alert(
            "Tu carrito está vacío."
        );

        return;
    }


    let message =
`Hola, Elda Style 👋

Quiero consultar por estas prendas:

`;


    cart.forEach((product,index) => {

        message +=
`${index + 1}. ${product.nombre}
Código: ${product.codigo}
Foto: ${GITHUB_IMAGE_BASE}${product.imagenes[0]}

`;

    });


    message +=
`¿Me pueden indicar disponibilidad y precios?`;


    const url =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);


    window.open(url,"_blank");

}


/* =====================================================
   INICIO
===================================================== */

renderProducts();

updateCart();

</script>
