<!DOCTYPE html>
<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elda Style</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7f7;
    color:#222;
}

/* HEADER */
header{
    background:#111;
    color:white;
    padding:16px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:28px;
    font-weight:bold;
    letter-spacing:1px;
}

nav{
    display:flex;
    gap:10px;
    align-items:center;
}

nav button{
    background:none;
    border:none;
    color:white;
    cursor:pointer;
    font-size:15px;
}

.cart-button{
    background:white;
    color:#111;
    border-radius:20px;
    padding:9px 15px;
    font-weight:bold;
}

/* HERO */
.hero{
    min-height:320px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    padding:40px 20px;

    background:
    linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
    url("https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=1600&q=80")
    center/cover;
}

.hero h1{
    font-size:48px;
    margin-bottom:10px;
}

.hero p{
    font-size:19px;
}

/* CONTENEDOR */
.container{
    width:90%;
    max-width:1250px;
    margin:30px auto;
}

/* BUSCADOR */
.search-box{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:20px;
    font-size:16px;
}

/* CATEGORIAS */
.categories{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:25px;
}

.categories button{
    padding:10px 18px;
    border:1px solid #222;
    background:white;
    border-radius:20px;
    cursor:pointer;
}

.categories button.active,
.categories button:hover{
    background:#111;
    color:white;
}

/* PRODUCTOS */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
}

.product{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    transition:.2s;
}

.product:hover{
    transform:translateY(-3px);
}

.product-image{
    width:100%;
    height:300px;
    object-fit:cover;
    display:block;
    cursor:pointer;
    background:#eee;
}

.product-info{
    padding:15px;
}

.product-code{
    color:#777;
    font-size:13px;
    margin-bottom:5px;
}

.product-name{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.price{
    font-weight:bold;
    margin-bottom:12px;
}

.product-actions{
    display:flex;
    gap:8px;
}

.product-actions button{
    flex:1;
    border:none;
    padding:10px;
    border-radius:7px;
    cursor:pointer;
}

.gallery-btn{
    background:#eee;
}

.whatsapp-btn{
    background:#25D366;
    color:white;
}

.cart-add{
    width:100%;
    margin-top:8px;
    padding:10px;
    border:none;
    border-radius:7px;
    background:#111;
    color:white;
    cursor:pointer;
}

/* VACIO */
.empty{
    text-align:center;
    padding:60px 20px;
    color:#777;
    grid-column:1/-1;
}

/* FOOTER */
footer{
    margin-top:50px;
    background:#111;
    color:white;
    text-align:center;
    padding:30px 20px;
}

/* WHATSAPP */
.whatsapp-floating{
    position:fixed;
    right:20px;
    bottom:20px;
    width:58px;
    height:58px;
    background:#25D366;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    text-decoration:none;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
    z-index:2000;
}

/* GALERIA */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:3000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:900px;
    text-align:center;
    position:relative;
}

.modal-image{
    max-width:90%;
    max-height:70vh;
    object-fit:contain;
    border-radius:8px;
}

.close{
    position:absolute;
    right:0;
    top:-45px;
    color:white;
    font-size:38px;
    cursor:pointer;
}

.gallery-controls{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:15px;
}

.gallery-controls button{
    background:white;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
}

.thumbnails{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:15px;
    flex-wrap:wrap;
}

.thumbnails img{
    width:65px;
    height:65px;
    object-fit:cover;
    cursor:pointer;
    border:2px solid transparent;
    border-radius:5px;
}

.thumbnails img.active{
    border-color:white;
}

/* CARRITO */
.cart-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:2500;
    justify-content:flex-end;
}

.cart-modal.show{
    display:flex;
}

.cart{
    background:white;
    width:100%;
    max-width:430px;
    height:100%;
    padding:25px;
    overflow-y:auto;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.cart-close{
    font-size:28px;
    cursor:pointer;
}

.cart-item{
    display:flex;
    gap:12px;
    border-bottom:1px solid #ddd;
    padding:12px 0;
}

.cart-item img{
    width:70px;
    height:80px;
    object-fit:cover;
    border-radius:6px;
}

.cart-item-info{
    flex:1;
}

.remove-item{
    margin-top:8px;
    background:#eee;
    border:none;
    padding:6px 9px;
    border-radius:5px;
    cursor:pointer;
}

.cart-total{
    font-size:20px;
    font-weight:bold;
    margin:20px 0;
}

.order-whatsapp{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#25D366;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* CELULAR */
@media(max-width:700px){

    header{
        padding:14px 15px;
    }

    .logo{
        font-size:22px;
    }

    nav button:not(.cart-button){
        display:none;
    }

    .hero{
        min-height:260px;
    }

    .hero h1{
        font-size:36px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .product-image{
        height:220px;
    }

    .product-info{
        padding:10px;
    }

    .product-name{
        font-size:15px;
    }

    .product-actions{
        flex-direction:column;
    }
}
</style>
</head>

/* ==========================================

function renderProducts(){

    const container =
    document.getElementById("products");

    const search =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();


    const filtered =
    products.filter(product => {

        const categoryMatch =
        currentCategory === "todos" ||
        product.categoria === currentCategory;


        const searchMatch =
        product.codigo
        .toLowerCase()
        .includes(search)

        ||

        product.nombre
        .toLowerCase()
        .includes(search);


        return categoryMatch && searchMatch;

    });


    if(filtered.length === 0){

        container.innerHTML = `
            <div class="empty">
                No se encontraron productos.
            </div>
        `;

        return;
    }


    container.innerHTML =
    filtered.map(product => {

        const image =
        product.imagenes[0];


        return `

        <article class="product">

            <img
                class="product-image"
                src="${image}"
                alt="${product.nombre}"
                onclick="openGallery('${product.codigo}')"
                onerror="imageError(this,'${product.codigo}')"
            >


            <div class="product-info">

                    Código: ${product.codigo}

/* ==========================================
   ERROR IMAGEN
========================================== */

function imageError(image,codigo){

    image.onerror = null;

    image.src =
    "https://via.placeholder.com/500x600?text="
    + codigo;

}


/* ==========================================
   FILTROS
========================================== */

function filterCategory(category){

    currentCategory = category;


    document
    .querySelectorAll(".categories button")
    .forEach(button =>
        button.classList.remove("active")
    );


    if(category === "todos")
        document.getElementById("catTodos")
        .classList.add("active");


    if(category === "ropa")
        document.getElementById("catRopa")
        .classList.add("active");


    if(category === "calzado")
        document.getElementById("catCalzado")
        .classList.add("active");


    if(category === "accesorios")
        document.getElementById("catAccesorios")
        .classList.add("active");


    renderProducts();

}


/* ==========================================
   WHATSAPP
========================================== */

function buyWhatsApp(codigo){

    const product =
    products.find(
        item => item.codigo === codigo
    );


    if(!product) return;


    const imageUrl =
    GITHUB_IMAGE_BASE +
    product.imagenes[0];


    const message =
    `Hola, Elda Style 👋

Estoy interesado/a en esta prenda:

🆔 Código: ${product.codigo}

🛍️ Producto: ${product.nombre}

🖼️ Foto del producto:
${imageUrl}

¿Está disponible y cuál es su precio?`;


    const url =
    `https://wa.me/${WHATSAPP_NUMBER}?text=`
    + encodeURIComponent(message);


    window.open(url,"_blank");

}


/* ==========================================
   GALERIA
========================================== */

function openGallery(codigo){

    const product =
    products.find(
        item => item.codigo === codigo
    );


    if(!product) return;


    currentProduct = product;

    currentImageIndex = 0;

    updateGallery();


    document
    .getElementById("galleryModal")
    .classList.add("show");

}


function updateGallery(){

    if(!currentProduct) return;


    const images =
    currentProduct.imagenes;


    document
    .getElementById("modalImage")
    .src =
    images[currentImageIndex];


    const thumbnails =
    document.getElementById("thumbnails");


    thumbnails.innerHTML =
    images.map((image,index) => `

        <img
            src="${image}"
            class="${
                index === currentImageIndex
                ? "active"
                : ""
            }"
            onclick="selectImage(${index})"
            alt="${currentProduct.codigo}"
        >

    `).join("");

}


function selectImage(index){

    currentImageIndex = index;

    updateGallery();

}


function previousImage(){

    if(!currentProduct) return;


    currentImageIndex--;


    if(currentImageIndex < 0){

        currentImageIndex =
        currentProduct.imagenes.length - 1;

    }


    updateGallery();

}


function nextImage(){

    if(!currentProduct) return;


    currentImageIndex++;


    if(
        currentImageIndex >=
        currentProduct.imagenes.length
    ){

        currentImageIndex = 0;

    }


    updateGallery();

}


function closeGallery(){

    document
    .getElementById("galleryModal")
    .classList.remove("show");

}


/* ==========================================
   TECLADO
========================================== */

document.addEventListener(
"keydown",
function(event){

    const modal =
    document.getElementById("galleryModal");


    if(!modal.classList.contains("show"))
        return;


    if(event.key === "ArrowLeft")
        previousImage();


    if(event.key === "ArrowRight")
        nextImage();


    if(event.key === "Escape")
        closeGallery();

});


/* ==========================================
   CARRITO
========================================== */

function addToCart(codigo){

    const product =
    products.find(
        item => item.codigo === codigo
    );


    if(!product) return;


    cart.push(product);

    updateCart();

}


function updateCart(){

    document
    .getElementById("cartCount")
    .textContent = cart.length;


    const container =
    document.getElementById("cartItems");


    if(cart.length === 0){

        container.innerHTML = `
            <div class="empty">
                Tu carrito está vacío.
            </div>
        `;

        document
        .getElementById("cartTotal")
        .textContent = "Bs 0";

        return;
    }


    container.innerHTML =
    cart.map((product,index) => `

        <div class="cart-item">

            <img
                src="${product.imagenes[0]}"
                alt="${product.nombre}"
            >

            <div class="cart-item-info">

                <strong>
                    ${product.nombre}
                </strong>

                <div>
                    Código: ${product.codigo}
                </div>

                <button
                    class="remove-item"
                    onclick="removeFromCart(${index})">

                    Eliminar

                </button>

            </div>

        </div>

    `).join("");


    document
    .getElementById("cartTotal")
    .textContent = "Consultar";

}


function removeFromCart(index){

    cart.splice(index,1);

    updateCart();

}


function openCart(){

    document
    .getElementById("cartModal")
    .classList.add("show");

}


function closeCart(){

    document
    .getElementById("cartModal")
    .classList.remove("show");

}


/* ==========================================
   WHATSAPP CARRITO
========================================== */

function sendCartWhatsApp(){

    if(cart.length === 0){

        alert("El carrito está vacío.");

        return;
    }


    let message =
    "Hola, Elda Style 👋\n\n" +
    "Quiero consultar por estos productos:\n\n";


    cart.forEach((product,index) => {

        const imageUrl =
        GITHUB_IMAGE_BASE +
        product.imagenes[0];


        message +=
        `${index + 1}. ${product.codigo} - ${product.nombre}\n` +
        `🖼️ Foto:\n${imageUrl}\n\n`;

    });


    message +=
    "¿Me pueden indicar disponibilidad y precio?";


    const url =
    `https://wa.me/${WHATSAPP_NUMBER}?text=`
    + encodeURIComponent(message);


    window.open(url,"_blank");

}


/* ==========================================
   CERRAR MODALES
========================================== */

document
.getElementById("galleryModal")
.addEventListener(
"click",
function(event){

    if(event.target === this)
        closeGallery();

});


document
.getElementById("cartModal")
.addEventListener(
"click",
function(event){

    if(event.target === this)
        closeCart();

});


/* ==========================================
   INICIO
========================================== */

renderProducts();

updateCart();

</script>
